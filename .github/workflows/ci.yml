name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  # Builds the image once (next build typechecks), runs deploy/smoke.sh
  # against it and pushes it as candidate-<tree>. promote makes it
  # tree-<tree> once every job passed, and release ships only a tree- image.
  image:
    uses: zyx1121/.github/.github/workflows/image.yml@main
    permissions:
      contents: read
      packages: write
    with:
      images: '[{"name": "ghcr.io/nycu-winlab/video.winlab.tw"}]'
      smoke: bash deploy/smoke.sh

  promote:
    needs: [check, image]
    uses: zyx1121/.github/.github/workflows/promote.yml@main
    permissions:
      contents: read
      packages: write
    with:
      images: '["ghcr.io/nycu-winlab/video.winlab.tw"]'
